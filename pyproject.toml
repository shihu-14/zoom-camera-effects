[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finger-quad-effect"
version = "0.1.0"
description = "Real-time hand gesture quadrilateral effects with virtual camera output."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.24,<2",
    "opencv-contrib-python>=4.8,<4.12",
    "pyvirtualcam>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
finger-quad-effect = "finger_quad_effect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
